name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  issues: write
  contents: write   # to create the GitHub release (the version / release date badges in the README read it)

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'ScrudgMcDack' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      - name: Create GitHub release for the version in pyproject.toml
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 -E '^version *=' pyproject.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists"
          else
            gh release create "v$version" --title "v$version" --generate-notes --target "$GITHUB_SHA"
          fi
